[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-data"
version = "1.0.0"
description = "X-Data: cross-platform OSINT CLI for public and authorized investigations."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
  "requests>=2.31,<3",
  "dnspython>=2.6,<3"
]

[project.scripts]
xdata = "xdata.cli:main"
osint = "xdata.cli:main"

[tool.setuptools.packages.find]
include = ["xdata*"]
